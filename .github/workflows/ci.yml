name: CI

# One run per pull request (pull_request event) and one per merge to master
# (push event). Feature-branch pushes do not trigger a second run.
on:
  pull_request:
  push:
    branches:
      - master

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    name: Rustfmt & Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions-rust-lang/setup-rust-toolchain@a188e68d0fd2bd36ad51dccb2b07ba6e75105f30 # v2.0.1
        with:
          components: rustfmt, clippy
      - name: Rustfmt
        run: cargo fmt --all --check
      # Not --all-features: that turns on both TLS backends, which src/lib.rs rejects.
      - name: Clippy
        run: cargo clippy --all-targets --features test-support --locked -- -D warnings
      # Builds the crate as published; some cargo warnings only appear there.
      - name: Verify package
        run: cargo package --locked

  msrv:
    name: Minimum Rust version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Read rust-version
        id: msrv
        run: echo "version=$(sed -n 's/^rust-version = "\(.*\)"/\1/p' Cargo.toml)" >> "$GITHUB_OUTPUT"
      - uses: actions-rust-lang/setup-rust-toolchain@a188e68d0fd2bd36ad51dccb2b07ba6e75105f30 # v2.0.1
        with:
          toolchain: ${{ steps.msrv.outputs.version }}
      - name: Check
        run: cargo check --all-targets --features test-support --locked

  test:
    # Keep this repo's existing job name: branch rulesets may require it.
    name: thunderstore-engine Tests and Coverage
    runs-on: ubuntu-latest
    container:
      image: xd009642/tarpaulin:0.37.6-nightly@sha256:0467f9ce2c089549f11abef4183d8fbd126ea8e793186de660d43ec3b6feda26
      options: --security-opt seccomp=unconfined
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Generate code coverage
        run: cargo tarpaulin --engine llvm --features test-support
      - name: Upload coverage to Coveralls
        uses: coverallsapp/github-action@8d6379e14d29928660c4ba802d8e85393440b329 # v2.3.8
        with:
          github-token: ${{ github.token }}

  windows:
    name: thunderstore-engine Tests on Windows
    runs-on: windows-latest
    env:
      # The runner image does not promise NASM, so use aws-lc-sys's prebuilt objects.
      AWS_LC_SYS_PREBUILT_NASM: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions-rust-lang/setup-rust-toolchain@a188e68d0fd2bd36ad51dccb2b07ba6e75105f30 # v2.0.1
        with:
          toolchain: 1.94.0
      - name: Test with the test fixture
        run: cargo test --features test-support
      - name: Test with default features off
        run: cargo test --no-default-features

  without_io:
    name: thunderstore-engine without the io feature
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions-rust-lang/setup-rust-toolchain@a188e68d0fd2bd36ad51dccb2b07ba6e75105f30 # v2.0.1
        with:
          toolchain: 1.94.0
      - name: Build and test with default features off
        run: cargo test --no-default-features
      - name: Refuse an HTTP client or async runtime with default features off
        run: |
          tree="$(cargo tree --no-default-features -e normal --prefix none)"
          status=0
          for crate in reqwest hyper tokio async-std smol zip; do
            if grep -q "^${crate} v" <<< "$tree"; then
              echo "::error::${crate} is in the dependency tree with default features off"
              status=1
            fi
          done
          exit "$status"
