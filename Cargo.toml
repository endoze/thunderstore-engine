[package]
name = "thunderstore-engine"
version = "0.1.0"
edition = "2024"
description = "Game-agnostic Thunderstore engine: API client, caching, dependency resolution, zip extraction, and schema-driven mod-loader install rules"
authors = ["Endoze <endoze@endozemedia.com>"]
license = "MIT"
readme = "README.md"
repository = "https://github.com/endoze/thunderstore-engine"
rust-version = "1.94.0"
categories = ["game-development", "api-bindings"]
keywords = ["thunderstore", "mod", "manager", "bepinex", "modding"]

[lib]
name = "thunderstore_engine"
path = "src/lib.rs"

[dependencies]
bytes = "1.5"
chrono = "0.4"
crc32fast = "1.3"
futures = "0.3"
fs_extra = "1.3.0"
reqwest = { version = "0.12.14", features = ["json", "stream", "rustls-tls"], default-features = false }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
time = { version = "0.3", features = ["serde-well-known"] }
tokio = { version = "1.32", features = ["full"] }
tracing = "0.1.41"
zip = "2.2.3"
bincode = "1.3.3"
zstd = "0.13.0"
lasso = { version = "0.7", features = ["serialize"] }

[dev-dependencies]
mockito = "1.2.0"
tempfile = "3.10.1"
tokio-test = "0.4.3"
criterion = { version = "0.5", features = ["html_reports"] }

[features]
bench = []

[[bench]]
name = "manifest_formats"
harness = false
required-features = ["bench"]

[[bench]]
name = "search_benchmark"
harness = false
required-features = ["bench"]
